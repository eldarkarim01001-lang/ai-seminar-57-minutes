{q:{kk:'Ең маңызды сұрақ: AI-мен <em>не істей аламын?</em> емес, <em>не үшін істеймін?</em> деген сұраққа дайынсыз ба?',ru:'Главный вопрос: готовы ли вы спросить не <em>«что я могу сделать с AI?»</em>, а <em>«зачем я это делаю?»</em>?',en:'The key question: are you ready to ask not <em>“what can I do with AI?”</em> but <em>“why am I doing it?”</em>?'},o:{kk:['Иә. Бастайық!','Дәл қазір көргім келеді','Практикада тексерейік','Мен дайынмын'],ru:['Да. Начнём!','Хочу увидеть прямо сейчас','Проверим на практике','Я готов'],en:['Yes. Let’s begin!','I want to see it now','Let’s test it in practice','I’m ready']}}
];
let lang='kk',qi=0,chosen=false,answers=[];
const welcome=document.getElementById('welcome'),qs=document.getElementById('questions'),fin=document.getElementById('final'),qtext=document.getElementById('qtext'),options=document.getElementById('options'),response=document.getElementById('response'),next=document.getElementById('next'),bar=document.getElementById('bar');
function applyLang(){const d=data[lang];document.documentElement.lang=lang;document.getElementById('welcomeTitle').innerHTML=d.welcomeTitle;document.getElementById('welcomeSub').innerHTML=d.welcomeSub;document.getElementById('startBtn').textContent=d.start;document.getElementById('resultBadge').textContent=d.result;document.getElementById('restartBtn').textContent=d.restart;if(qs.style.display==='block')render();document.querySelectorAll('.lang').forEach(x=>x.classList.toggle('active',x.dataset.lang===lang))}
document.querySelectorAll('.lang').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;applyLang()});
function start(){welcome.classList.add('fadeout');setTimeout(()=>{welcome.style.display='none';qs.style.display='block';qs.classList.add('fadein');render()},380)}
function render(){chosen=false;next.classList.remove('show');response.textContent='';const x=questions[qi];document.getElementById('qno').textContent=`QUESTION ${String(qi+1).padStart(2,'0')} / ${questions.length}`;qtext.innerHTML=x.q[lang];options.innerHTML='';x.o[lang].forEach((t,i)=>{const b=document.createElement('button');b.className='option';b.innerHTML=t;b.onclick=()=>choose(b,i);options.appendChild(b)});bar.style.width=((qi+1)/questions.length*100)+'%'}
function choose(b,i){if(chosen)return;chosen=true;answers[qi]=i;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');response.textContent=data[lang].replies[i%4];next.textContent=data[lang].next;next.classList.add('show')}
function nextQuestion(){if(qi<questions.length-1){qs.classList.remove('fadein');qs.classList.add('fadeout');setTimeout(()=>{qi++;qs.classList.remove('fadeout');render();qs.classList.add('fadein')},360)}else{qs.classList.add('fadeout');setTimeout(()=>{qs.style.display='none';makeProfile();fin.style.display='block';fin.classList.add('fadein')},400)}}
function makeProfile(){const scores={people:0,creative:0,efficiency:0,practical:0};answers.forEach((a,q)=>{if(a==null)return;if(q===0){if(a===0)scores.people+=3;else if(a===1)scores.creative+=3;else if(a===2)scores.people+=2;else scores.efficiency+=2}if(q===1){if(a===0)scores.efficiency+=2;else if(a===1)scores.people+=2;else if(a===2)scores.creative+=2;else scores.practical+=2}if(q===2){if(a===0||a===3)scores.efficiency+=2;else if(a===1)scores.creative+=2;else scores.people+=2}if(q===3){if(a===0||a===3)scores.efficiency+=2;else if(a===1)scores.creative+=2;else scores.people+=2}if(q===4){if(a===0||a===1)scores.creative+=2;else if(a===2)scores.people+=2;else scores.efficiency+=2}if(q===5){if(a===0)scores.practical+=2;else if(a===1)scores.practical+=1;else if(a===2)scores.people+=2;else scores.creative+=2}if(q===6){if(a===0||a===3)scores.creative+=2;else if(a===1)scores.efficiency+=2;else scores.people+=2}});
const type=Object.entries(scores).sort((a,b)=>b[1]-a[1])[0][0];
const profiles={
people:{icon:'👥',title:{kk:'Адамға бағытталған мұғалім',ru:'Учитель, ориентированный на человека',en:'People-first teacher'},text:{kk:'Сіздің жауаптарыңыздан бір нәрсе анық көрінеді: технология сіз үшін мақсат емес, оқушыға көбірек уақыт бөлуге көмектесетін құрал. Сіз «AI не істейді?» дегеннен гөрі «AI маған адамға көбірек уақыт бере ме?» деп ойлайсыз.',ru:'По вашим ответам видно: технология для вас — не цель, а инструмент, который помогает уделять больше времени ученику. Вы думаете не только о том, что делает AI, но и о том, какое место он освобождает для человека.',en:'Your answers suggest that technology is not the goal for you, but a tool that can create more time for students. You look beyond what AI can do to what it can make more room for.'},joke:{kk:'AI сізге 57 минут берсе, оны Excel-ге емес, адамға жұмсау ықтималдығы жоғары. Excel сәл ренжуі мүмкін 😄',ru:'Если AI подарит вам 57 минут, вы, скорее всего, потратите их на человека, а не на Excel. Excel может слегка обидеться 😄',en:'If AI gives you 57 minutes, you are likely to spend them on people rather than Excel. Excel may feel a little offended 😄'}},
creative:{icon:'💡',title:{kk:'Идея генераторы',ru:'Генератор идей',en:'Idea generator'},text:{kk:'Сіз жаңа мүмкіндікті көрсеңіз, бірден «ал мұны тағы қалай қолдануға болады?» деп ойлайсыз. AI сіздің қолыңызда шығармашылық серіктеске айналуы мүмкін.',ru:'Увидев новую возможность, вы сразу думаете: «А как ещё это можно применить?» В ваших руках AI может стать творческим партнёром.',en:'When you see a new possibility, you immediately ask: “How else could this be used?” In your hands, AI can become a creative partner.'},joke:{kk:'Сізге 57 минут босаса, демалуға емес, тағы бір жоба ойлап табуға кетуі мүмкін 😄',ru:'Освободившиеся 57 минут могут уйти не на отдых, а на новый проект 😄',en:'Give you 57 free minutes and they may become another project 😄'}},
efficiency:{icon:'⚡',title:{kk:'Уақыттың стратег-менеджері',ru:'Стратег времени',en:'Time strategist'},text:{kk:'Сіз AI-ды ең алдымен уақытты үнемдеу үшін көресіз. Қайталанатын жұмысты қысқарту, контентті тез дайындау және процесті жеңілдету сіз үшін маңызды.',ru:'Вы прежде всего видите в AI способ экономить время: сокращать рутину, быстрее готовить контент и упрощать процессы.',en:'You primarily see AI as a way to save time: reduce repetitive work, create content faster, and simplify processes.'},joke:{kk:'Сізге 57 минут сыйласа, бірінші сұрағыңыз: «Тағы қанша минут үнемдеуге болады?» 😄',ru:'Получив 57 минут, вы, вероятно, спросите: «А сколько ещё можно сэкономить?» 😄',en:'Give you 57 minutes and your first question may be: “How many more minutes can we save?” 😄'}},
practical:{icon:'🧭',title:{kk:'Сақтықпен зерттейтін практик',ru:'Практик-исследователь',en:'Practical explorer'},text:{kk:'Сіз технологияға қызығасыз, бірақ бірден сене салмайсыз. Алдымен байқап көріп, нәтижесін тексеріп, содан кейін ғана күнделікті жұмысыңызға енгізгіңіз келеді.',ru:'Вам интересны технологии, но вы не спешите доверять им. Сначала пробуете, проверяете результат и только потом внедряете в работу.',en:'You are curious about technology but do not trust it blindly. You prefer to test it, verify the result, and then bring it into daily work.'},joke:{kk:'AI «Маған сеніңіз» десе, сіз: «Алдымен көрсетіңіз» дейсіз. Дәлел керек 😄',ru:'Если AI говорит «Доверьтесь мне», вы отвечаете: «Сначала покажите». Нужны доказательства 😄',en:'If AI says “Trust me,” you answer: “Show me first.” Evidence matters 😄'}}
};const p=profiles[type];document.getElementById('profileIcon').textContent=p.icon;document.getElementById('profileTitle').textContent=p.title[lang];document.getElementById('profileText').textContent=p.text[lang];document.getElementById('profileQuote').textContent='«'+p.joke[lang]+'»';document.getElementById('resultSmall').textContent=data[lang].small}
document.addEventListener('click',e=>{const b=e.target.closest('.btn');if(!b)return;const r=document.createElement('span');r.className='ripple';const rect=b.getBoundingClientRect();r.style.width=r.style.height=Math.max(rect.width,rect.height)+'px';r.style.left=e.clientX-rect.left-rect.width/2+'px';r.style.top=e.clientY-rect.top-rect.height/2+'px';b.appendChild(r);setTimeout(()=>r.remove(),600)});
for(let i=0;i<85;i++){const p=document.createElement('i');p.className='p';p.style.left=Math.random()*100+'%';p.style.animationDuration=(5+Math.random()*10)+'s';p.style.animationDelay=(-Math.random()*12)+'s';p.style.opacity=.2+Math.random()*.7;document.getElementById('particles').appendChild(p)}
</script>
